name: Validate English level site
on:
  push:
    branches: [content/level-english-20261119]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler: '2.6.9'
      - name: Install, audit and build
        env:
          JEKYLL_ENV: production
        run: |
          gem install bundler-audit --no-document
          bundler-audit update
          for site in uo-jekyll uo-wiki; do
            (cd "$site" && bundle install && bundler-audit check)
          done
          (cd uo-jekyll && bundle exec jekyll build --destination "$GITHUB_WORKSPACE/_pages")
          (cd uo-wiki && bundle exec jekyll build --destination "$GITHUB_WORKSPACE/_pages/wiki")
          python3 scripts/verify_site.py _pages
      - uses: actions/upload-artifact@v4
        with:
          name: level-preview
          path: _pages
