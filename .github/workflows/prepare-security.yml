name: Prepare security lockfiles
on:
  push:
    branches: [fix/dependency-security-20261104]
    paths: [.github/workflows/prepare-security.yml]
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/dependency-security-20261104
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler: '2.6.9'
      - name: Update and audit both sites
        run: |
          gem install bundler-audit --no-document
          bundler-audit update
          for site in uo-jekyll uo-wiki; do
            (cd "$site" && bundle lock --bundler 2.6.9 && bundle update && bundle lock --add-platform x64-mingw-ucrt x86_64-linux && bundler-audit check)
          done
      - name: Build and verify
        env:
          JEKYLL_ENV: production
        run: |
          (cd uo-jekyll && bundle exec jekyll build --baseurl /rila-site --destination "$RUNNER_TEMP/site")
          (cd uo-wiki && bundle exec jekyll build --baseurl /rila-site/wiki --destination "$RUNNER_TEMP/site/wiki")
          test -s "$RUNNER_TEMP/site/index.html"
          test -s "$RUNNER_TEMP/site/wiki/index.html"
          test -s "$RUNNER_TEMP/site/wiki/search-index.json"
          python3 - <<'PY'
          import json, pathlib
          root = pathlib.Path(__import__('os').environ['RUNNER_TEMP']) / 'site'
          entries = json.loads((root / 'wiki/search-index.json').read_text())
          assert len(entries) > 50, len(entries)
          pages = list(root.rglob('*.html'))
          assert len(pages) > 50, len(pages)
          print(f"Verified {len(pages)} HTML pages and {len(entries)} search entries")
          PY
      - name: Commit generated lockfiles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uo-jekyll/Gemfile.lock uo-wiki/Gemfile.lock
          git commit -m "Resolve and audit current Ruby dependencies"
          git push origin HEAD:fix/dependency-security-20261104
