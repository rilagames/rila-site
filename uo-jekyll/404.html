<!doctype html>

<head>

    <title>Yönlendiriliyor</title>

  <body onload="redirect()">
	<h1 style="text-align: center; padding-top: 50px; display: block;">Yönlendiriliyor...</h1>
	<script>
	  function redirect() {
		setTimeout(function(){ 
				window.location.replace({{ "/" | relative_url | jsonify }});
			}
			, 100);	
		}
	</script>
  </body>
</html>
